name: Java CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: sample-java-app

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: maven

    - name: Build
      run: mvn clean compile

    - name: Run Tests
      run: mvn test

    - name: Package
      run: mvn clean package -DskipTests

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: application
        path: target/*.jar

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker Image
      run: |
        docker build \
        -t ghcr.io/${{ github.repository_owner }}/sample-java-app:${{ github.sha }} \
        .

    - name: Push Docker Image
      run: |
        docker push \
        ghcr.io/${{ github.repository_owner }}/sample-java-app:${{ github.sha }}
