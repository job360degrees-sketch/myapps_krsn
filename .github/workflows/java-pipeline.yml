name: Build, Test, and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout Code from repository
    - name: Check out code
      uses: actions/checkout@v4

    # 2. Setup environment (e.g., Node.js)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Compile / Install dependencies
    - name: Install dependencies
      run: npm install

    # 4. Run test cases
    - name: Run test cases
      run: npm test

    # 5. Build project
    - name: Build project
      run: npm run build

    # 6. Deploy to server or cloud provider
    - name: Deploy to production
      run: |
        echo "Deploying application..."
        # Add your server deployment or cloud CLI commands here
        # Example: scp, aws cli, or webhook trigger
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
